name: tests

on:
  push:
  pull_request:

jobs:
  pester:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            shell: powershell   # Windows PowerShell 5.1
          - os: windows-latest
            shell: pwsh         # PowerShell 7
          - os: ubuntu-latest
            shell: pwsh         # Core logika je neovisna o Windowsima
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4
      - name: Pester 5.7.1
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck
      - name: Testovi
        env:
          # GUI test (samo Windows PowerShell 5.1) sprema snimke svih stranica sučelja.
          GPS_SCREENSHOT_DIR: ${{ github.workspace }}/gui-screenshots
        run: |
          Import-Module Pester -RequiredVersion 5.7.1
          $config = New-PesterConfiguration
          $config.Run.Path = './tests'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config
      - name: Snimke sučelja
        if: always() && matrix.shell == 'powershell'
        uses: actions/upload-artifact@v4
        with:
          name: gui-screenshots
          path: gui-screenshots
          if-no-files-found: ignore
