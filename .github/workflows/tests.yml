name: tests

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      snimke_u_biljeske:
        description: 'Snimke sučelja ispisati i kao bilješke (kad artefakti nisu dostupni)'
        type: boolean
        default: false

jobs:
  pester:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            shell: powershell   # Windows PowerShell 5.1
          - os: windows-latest
            shell: pwsh         # PowerShell 7
          - os: ubuntu-latest
            shell: pwsh         # Core logika je neovisna o Windowsima
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4
      - name: Pester 5.7.1
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck
      - name: Testovi
        env:
          # GUI test (samo Windows PowerShell 5.1) sprema snimke svih stranica sučelja.
          GPS_SCREENSHOT_DIR: ${{ github.workspace }}/gui-screenshots
        run: |
          Import-Module Pester -RequiredVersion 5.7.1
          $config = New-PesterConfiguration
          $config.Run.Path = './tests'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config
      - name: Snimke sučelja
        if: always() && matrix.shell == 'powershell'
        uses: actions/upload-artifact@v4
        with:
          name: gui-screenshots
          path: gui-screenshots
          if-no-files-found: ignore
      - name: Snimke kao bilješke (priprema)
        if: always() && matrix.shell == 'powershell' && inputs.snimke_u_biljeske
        run: ./.github/scripts/Export-ScreenshotNotes.ps1 -Folder gui-screenshots -Prepare
      - name: Snimke kao bilješke (1/5)
        if: always() && matrix.shell == 'powershell' && inputs.snimke_u_biljeske
        run: ./.github/scripts/Export-ScreenshotNotes.ps1 -Folder gui-screenshots -Part 0
      - name: Snimke kao bilješke (2/5)
        if: always() && matrix.shell == 'powershell' && inputs.snimke_u_biljeske
        run: ./.github/scripts/Export-ScreenshotNotes.ps1 -Folder gui-screenshots -Part 1
      - name: Snimke kao bilješke (3/5)
        if: always() && matrix.shell == 'powershell' && inputs.snimke_u_biljeske
        run: ./.github/scripts/Export-ScreenshotNotes.ps1 -Folder gui-screenshots -Part 2
      - name: Snimke kao bilješke (4/5)
        if: always() && matrix.shell == 'powershell' && inputs.snimke_u_biljeske
        run: ./.github/scripts/Export-ScreenshotNotes.ps1 -Folder gui-screenshots -Part 3
      - name: Snimke kao bilješke (5/5)
        if: always() && matrix.shell == 'powershell' && inputs.snimke_u_biljeske
        run: ./.github/scripts/Export-ScreenshotNotes.ps1 -Folder gui-screenshots -Part 4
